[package]
name = "qmi8658a"
description = "A platform-agnostic embedded-hal driver for the QST QMI8658A 6-axis IMU"
categories = ["embedded", "hardware-support", "no-std"]
keywords = ["embedded-hal-driver", "qmi8658a", "imu", "accelerometer", "gyroscope"]
readme = "README.md"
version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
async = ["dep:embedded-hal-async"]
## Coordinate-frame types for converting readings into other frames.
coordinate-frame = ["dep:coordinate-frame"]
defmt = ["dep:defmt", "qmi8658a-registers/defmt", "coordinate-frame?/defmt"]

[lints]
workspace = true

[dependencies]
qmi8658a-registers.workspace = true
coordinate-frame = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
embedded-hal.workspace = true
embedded-hal-async = { workspace = true, optional = true }

[dev-dependencies]
embedded-hal.workspace = true
qmi8658a-sim.workspace = true
embassy-futures.workspace = true

[package.metadata.release]
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}\n\n[{{version}}]: https://github.com/sunsided/qmi8658a/releases/tag/v{{version}}", exactly = 1 },
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
