name: Acceleration, angular rate and temperature
version: 1
author: Markus Mayer

steps:
  - wait-serial: 'QMI8658A ok who_am_i=0x05'
  - wait-serial: 'running accel=8g gyro=512dps odr=56Hz'
  - wait-serial: 'accel x=0.00 y=0.00 z=0.00 g gyro x=0.0 y=0.0 z=0.0 dps temp=25.0C'

  # Lying flat: 1 g on Z.
  - set-control:
      part-id: imu1
      control: accelZ
      value: 1000
  - wait-serial: 'accel x=0.00 y=0.00 z=1.00 g'

  # Tilted: half a g on X.
  - set-control:
      part-id: imu1
      control: accelX
      value: -500
  - wait-serial: 'accel x=-0.50 y=0.00 z=1.00 g'

  - set-control:
      part-id: imu1
      control: gyroX
      value: -90
  - wait-serial: 'gyro x=-90.0 y=0.0 z=0.0 dps'

  - set-control:
      part-id: imu1
      control: temperature
      value: 35
  - wait-serial: 'temp=35.0C'
