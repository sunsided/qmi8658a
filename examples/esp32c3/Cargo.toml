[package]
name = "qmi8658a-example-esp32c3"
description = "Reads acceleration, angular rate and temperature from a QMI8658A on an ESP32-C3"
version = "0.1.0"
license = "EUPL-1.2 OR MIT OR Apache-2.0"
edition = "2024"
publish = false

[lints.clippy]
# Modules live in `name.rs` plus `name/`, never in `name/mod.rs`.
mod_module_files = "deny"

[dependencies]
qmi8658a = { path = "../../qmi8658a" }
esp-backtrace = { version = "0.20.0", features = ["esp32c3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c3"] }
esp-hal = { version = "1.2.2", features = ["esp32c3", "unstable"] }
esp-println = { version = "0.18.0", features = ["esp32c3"] }

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
debug = 2
lto = "fat"
codegen-units = 1
