[package]
name = "qmi8658a-wokwi-chip"
description = "Wokwi custom chip wrapping the qmi8658a-sim behavioral model"
version = "0.1.0"
license = "EUPL-1.2 OR MIT OR Apache-2.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[lints.clippy]
# Modules live in `name.rs` plus `name/`, never in `name/mod.rs`.
mod_module_files = "deny"

[dependencies]
qmi8658a-sim = { path = "../../qmi8658a-sim" }
wokwi_chip_ll = "0.2.0"

[profile.release]
opt-level = "s"
lto = true
